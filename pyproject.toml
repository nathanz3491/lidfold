[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lidfold"
version = "0.1.0"
description = "Camera-driven fold-away desktop effect for Windows laptops when the lid closes"
requires-python = ">=3.11"
dependencies = ["numpy", "opencv-python", "dxcam", "glfw", "moderngl", "pywin32", "pystray", "pillow",
                "pywebview"]

[project.scripts]
lidfold = "lidfold.__main__:main"

[project.gui-scripts]
lidfoldw = "lidfold.__main__:main"   # no console window: used by "Start with Windows"

[tool.setuptools]
packages = ["lidfold", "lidfold.ui"]

[tool.setuptools.package-data]
"lidfold.ui" = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
